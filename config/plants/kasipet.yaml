# ============================================================
# Plant overlay: KASIPET (Telangana, 15 MW)
# ============================================================
# Merged over config/settings.yaml when SOLAR_PLANT=kasipet.
# Anything not listed here is inherited from that file.
#
# WHAT IS INHERITED AND WHY THAT IS ACCEPTABLE
# --------------------------------------------
# The blend weights, clear-sky performance ratio, weather weight and
# correction strengths in settings.yaml were tuned on SIRMOUR's data.
# They are inherited here as a documented STARTING POINT, not as
# validated values for this site. Every one of them is re-tunable with
# the existing experiment scripts once this plant has a comparable run
# of days behind it:
#
#     SOLAR_PLANT=kasipet python -m tests.test_backtest
#     SOLAR_PLANT=kasipet python -m tests.test_weather_bias_experiment
#     SOLAR_PLANT=kasipet python -m tests.test_case_based_experiment
#
# What is NOT inherited is anything that would make two plants write to
# the same place: data folders, output folders, model state, S3
# prefixes, the weather cache, the log file and the scheduler lock port
# are all re-pointed below. The weather cache matters more than it
# looks - it is keyed by date and model only, so sharing it would serve
# Sirmour's Madhya Pradesh irradiance forecast to a Telangana plant.
# ============================================================

plant:
  key: kasipet
  code: KASIPET
  state: Telangana
  name: Kasipet Solar Plant
  latitude: 19.03943918
  longitude: 79.43691745
  altitude_m: 0            # not provided in the site details, same assumption as Sirmour
  capacity_mw: 15.0
  tilt_deg: 19.04          # ASSUMPTION: not provided; set equal to latitude (fixed-tilt heuristic) - update when the site confirms
  azimuth_deg: 180         # ASSUMPTION: true south, standard for the northern hemisphere
  timezone: Asia/Kolkata

forecast:
  interval_minutes: 15
  forecast_end_time: "19:00"
  output_frequency: 15
  # EIGHT scheduling times, not Sirmour's seven. The mentor's "Effective
  # Time Schedule Guide" gives the Kothagudem/Kasipet family a run at
  # 17:15 (engine block 70) that Sirmour does not have.
  run_times: ["06:45", "08:15", "09:45", "11:15", "12:45", "14:15", "15:45", "17:15"]

# The Telangana vendor's export differs from Sirmour's in three ways,
# all handled here rather than in code:
#   * the header is "Timestamp", not "TimeStamp";
#   * dates are dd-mm-yyyy, which pandas would otherwise read as
#     mm-dd-yyyy and silently move 06-08-2026 to 8 June;
#   * generation and irradiance are under different column names.
data_schema:
  timestamp_column: Timestamp
  dayfirst: true
  column_map:
    active_power-avg_mfm-out_kw: active_power_kw
    ghi_w_w_m2: ghi_w_m2
    module_temperature_c: mod_temp
    ambient_temperature_c: amb_temp
  timestamp_shift_minutes: 0

# 3 blocks / 45 minutes, per the guide's Kasipet-Kothagudem rule:
# a schedule generated at 11:15 (block 46) freezes blocks 46-48 and
# takes effect from block 49 / 12:00.
schedule_rules:
  freeze_blocks: 3

# No Enercast feed for this site - it is a Sirmour-only reference.
enercast:
  enabled: false
  filename_prefix: Kasipet

paths:
  raw_data: data/plants/kasipet/raw
  processed_data: data/plants/kasipet/processed
  historical_data: data/plants/kasipet/historical
  meter_data: data/plants/kasipet/meter
  site_data: data/plants/kasipet/site
  weather_data: data/plants/kasipet/weather
  windy_data: data/plants/kasipet/windy
  enercast_data: data/plants/kasipet/enercast

outputs:
  forecasts: outputs/plants/kasipet/forecasts
  schedules: outputs/plants/kasipet/schedules
  reports: outputs/plants/kasipet/reports
  json: outputs/plants/kasipet/json
  extracted_frames: outputs/plants/kasipet/extracted_frames

storage:
  # Same bucket and same AWS account as Sirmour, by request - only the
  # prefixes differ, so all three plants stay in one place.
  site_prefix: inputs/Telangana/KASIPET
  video_prefix: videos/Telangana/KASIPET
  video_cache: data/plants/kasipet/windy/s3_cache
  output_prefix: outputs/team2/KASIPET

windy_capture:
  video_dir: data/plants/kasipet/windy/new_videos
  screenshot_dir: data/plants/kasipet/windy/screenshots
  # Shared with the other plants on purpose: this is one Windy browser
  # login, not a quota. The per-plant API key comes from
  # WINDY_API_KEY_KASIPET in .env (see config/config.py).
  session_file: windy_session.json

weather:
  # Keyed by date + model only, so this MUST be separate or Kasipet
  # would read Sirmour's cached Madhya Pradesh forecast.
  cache_dir: data/plants/kasipet/weather/openmeteo_cache
  ecmwf_direct:
    cache_dir: data/plants/kasipet/weather/ecmwf_direct

clearsky:
  # CALIBRATED 2026-08-08 on all 37 days (tests/tune_plant_clearsky.py):
  # a clean interior optimum at 0.975, worth +0.77 pct points against the
  # 0.80 inherited from Sirmour (8.199% -> 7.428% average deviation).
  #
  # This is the one constant that is genuinely PER SITE rather than
  # statistical - it is how much of the theoretical clear-sky irradiance
  # this plant actually converts into metered AC power, which depends on
  # its modules, inverter sizing, DC:AC ratio and losses. Inheriting
  # Sirmour's value set the forecast's ceiling too low and under-forecast
  # every clear block: the first reconstruction of 2026-08-06 came out
  # 6% short on daily energy, which is that bias' signature.
  #
  # Worth knowing: the default grid in tests/test_backtest.py stops at
  # 0.85, so it reported 0.85 as "best" - the edge of its range, not an
  # optimum. That is why the dedicated sweep exists.
  performance_ratio: 0.975

residual_correction:
  model_path: models/plants/kasipet/residual_lgbm.txt

case_based_correction:
  # BUILT 2026-08-08 on all 37 days. Leave-one-day-out verdict: +0.242 pct
  # points, 26 of 37 unseen days helped - so it ships, at the same half
  # strength Sirmour uses. Rebuild after a run of new days with:
  #     SOLAR_PLANT=kasipet python -m tests.test_backtest
  #     SOLAR_PLANT=kasipet python -m tests.test_case_based_experiment
  case_store_path: models/plants/kasipet/case_store.csv

block_bias_correction:
  schedule_dir: outputs/plants/kasipet/schedules

scheduler:
  single_instance_port: 49733   # Sirmour holds 49732; every plant needs its own
  run_offset_seconds: 300       # start 5 min behind Sirmour so the two forecasts never load Chronos together

logging:
  log_file: kasipet.log
